<!DOCTYPE html>
<html>
<head>
<title>Bootstrap Assignment</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">

<!-- Typography -->
<h1 class="text-primary">Bootstrap Typography</h1>
<p class="lead">This is a lead paragraph example.</p>
<p class="text-muted">This is muted text.</p>
<p class="fw-bold">This is bold text.</p>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mt-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">MySite</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Grid -->
<div class="row mt-4">
  <div class="col-md-4 bg-primary text-white p-3">Column 1</div>
  <div class="col-md-4 bg-success text-white p-3">Column 2</div>
  <div class="col-md-4 bg-danger text-white p-3">Column 3</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
